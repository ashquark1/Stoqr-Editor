<section class="sign-in">
  <div class="sign-in__card">
    <!-- The logo tops the card (owner). -->
    <stoqr-logo appName="Editor" />

    <!-- Evenly between the logo and the button (owner). -->
    <h1 class="sign-in__title">Sign in to edit stock</h1>

    <!-- The button and Remember me sit together as one group (owner). -->
    <div class="sign-in__actions">
      <!-- Busy (spinner, aria-busy) while waiting on Google (US-43, shared pattern from US-42). -->
      @let busy = auth.redirecting() || !auth.gisReady() || auth.status() === 'signing-in';
      <button
        type="button"
        class="stoqr-btn stoqr-btn--primary sign-in__button"
        [class.stoqr-btn--busy]="busy"
        [disabled]="busy"
        [attr.aria-busy]="busy"
        (click)="auth.signIn(rememberMe.value)"
      >
        @if (busy) {
          <span class="stoqr-spinner" aria-hidden="true"></span>
        }
        @if (auth.redirecting()) {
          <!-- Silent return with Remember me (US-68): leaving for Google, back in a moment. -->
          Signing you in…
        } @else if (!auth.gisReady()) {
          Loading Google sign-in…
        } @else if (auth.status() === 'signing-in') {
          Signing in…
        } @else {
          Sign in with Google
        }
      </button>

      <!-- Remember me (US-44): below the button (owner); passed to sign-in, which keeps or deletes the record (US-67). -->
      <stoqr-checkbox class="sign-in__remember" label="Remember me" [formControl]="rememberMe" />
    </div>
  </div>
</section>

@if (auth.error(); as message) {
  <stoqr-toast
    title="Couldn't sign in"
    [message]="message"
    [autoDismissMs]="8000"
    (retry)="auth.retry()"
    (dismiss)="auth.clearError()"
  />
}
