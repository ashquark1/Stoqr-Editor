<div class="search-row" role="search">
  <div class="stoqr-search stoqr-search--inline search-row__box">
    <input
      #input
      type="search"
      class="stoqr-search__input"
      placeholder="Search by product name, SKU, brand or category..."
      autocomplete="off"
      aria-label="Search products"
      [formControl]="queryControl"
      (keyup.enter)="submit()"
    />
    @if (search.typed()) {
      <button type="button" class="search-row__clear" aria-label="Clear search" (click)="clear()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    }
  </div>
  <button
    type="button"
    class="stoqr-btn stoqr-btn--primary icon-btn"
    aria-label="Search"
    (click)="submit()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </svg>
    <span class="icon-btn__label">Search</span>
  </button>
</div>
