@if (search.listShown()) {
  @if (search.message(); as message) {
    <p class="picker__hint">{{ message }}</p>
  } @else if (search.totalMatches() === 0) {
    <!-- V1's wording (US-55, US-70). -->
    <stoqr-empty-state
      [message]="search.filtersChanged() ? 'No products match your search and filters.' : 'No products match your search.'"
    />
  } @else {
    <!-- Every match, no cap (US-55); the page scrolls. -->
    <ul class="picker__results" aria-label="Matching products">
      @for (row of search.matches(); track row.ref) {
        <li>
          <button type="button" class="picker__result" (click)="navigation.open(row.ref)">
            <span class="picker__name">{{ display(row.product.productName) }}</span>
            <span class="picker__meta">
              {{ display(row.product.brand) }} ·
              <span class="picker__sku">{{ display(row.product.sku) }}</span>
            </span>
            <span class="picker__stock">
              <span class="picker__qty">Qty {{ display(row.product.stockQty) }}</span>
              <stoqr-badge [status]="row.product.stockStatus" />
              <stoqr-sync-badge [kind]="search.syncBadgeOf(row.ref)" />
              <stoqr-status-badge [status]="row.product.status" />
            </span>
          </button>
        </li>
      }
    </ul>
  }
}
