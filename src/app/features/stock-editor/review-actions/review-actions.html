@switch (step()) {
  @case ('reviewing') {
    <button type="button" class="stoqr-btn stoqr-btn--primary" (click)="approve.emit()">Save changes</button>
    <button type="button" class="stoqr-btn stoqr-btn--ghost" (click)="back.emit()">Back</button>
  }
  @case ('saving') {
    <button type="button" class="stoqr-btn stoqr-btn--primary stoqr-btn--busy" disabled aria-busy="true">
      <span class="stoqr-spinner" aria-hidden="true"></span>
      Saving…
    </button>
    <button type="button" class="stoqr-btn stoqr-btn--ghost" disabled>Back</button>
  }
}
