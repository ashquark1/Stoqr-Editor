<section class="stock-editor">
  @if (sheets.loading()) {
    <stoqr-loading-overlay label="Loading both sheets…" />
  } @else if (sheets.error(); as message) {
    <stoqr-empty-state [message]="message">
      <div class="stock-editor__actions">
        <button type="button" class="stoqr-btn stoqr-btn--primary" (click)="sheets.reload()">
          Retry
        </button>
        @if (sheets.noAccess()) {
          <!-- The usual fix for no access is a different Google account (US-32). -->
          <button type="button" class="stoqr-btn stoqr-btn--secondary" (click)="auth.signOut()">
            Sign out
          </button>
        }
      </div>
    </stoqr-empty-state>
  } @else if (sheets.fetchedAt()) {
    @if (sheets.master().length === 0) {
      <stoqr-empty-state message="No products in the master sheet." />
    } @else {
      <div class="stock-editor__layout">
        <app-product-picker class="stock-editor__picker" />
        @if (search.selected()) {
          <app-product-summary class="stock-editor__summary" />
        }
      </div>
    }
  }
</section>
