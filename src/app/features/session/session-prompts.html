@if (auth.expiryWarning()) {
  <stoqr-toast
    variant="warning"
    title="Your session ends in 5 minutes"
    message="Stay signed in to keep working without interruption."
    actionLabel="Stay signed in"
    [autoDismissMs]="0"
    (retry)="auth.renew()"
    (dismiss)="auth.dismissExpiryWarning()"
  />
}

<stoqr-modal [open]="auth.expiredDialogOpen()" header="Session expired" [dismissable]="false">
  <div class="session">
    <p class="session__text">Your work is kept. Continue to keep working.</p>
    @if (auth.renewalError(); as message) {
      <p class="session__error" role="alert">{{ message }}</p>
    }
    <div class="session__actions">
      <!-- Busy while Google renews the session (US-43, shared pattern from US-42). -->
      <button
        type="button"
        class="stoqr-btn stoqr-btn--primary"
        [class.stoqr-btn--busy]="auth.status() === 'renewing'"
        [disabled]="auth.status() === 'renewing'"
        [attr.aria-busy]="auth.status() === 'renewing'"
        (click)="auth.renew()"
      >
        @if (auth.status() === 'renewing') {
          <span class="stoqr-spinner" aria-hidden="true"></span>
          Continuing…
        } @else {
          Continue
        }
      </button>
      <button type="button" class="stoqr-btn stoqr-btn--ghost" (click)="auth.signOut()">
        Sign out
      </button>
    </div>
  </div>
</stoqr-modal>
