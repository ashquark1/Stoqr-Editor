<header class="stoqr-topbar">
  <stoqr-logo [inline]="true" />
  @if (auth.hasSession()) {
    <div class="app-user">
      <span class="app-user__name">{{ auth.userLabel() }}</span>
      <button type="button" class="stoqr-btn stoqr-btn--ghost stoqr-btn--sm" (click)="auth.signOut()">
        Sign out
      </button>
    </div>
  }
</header>

<main class="app-content">
  <router-outlet />
</main>

<!--
  Session warning and "Session expired" dialog, on every page (US-06). Deferred so the
  dialog library loads only once someone has a session, keeping the first load small.
-->
@defer (when auth.hasSession()) {
  <app-session-prompts />
}

<!-- Which spreadsheets this build talks to (US-04). LIVE uses the warning pill. -->
<footer class="app-footer">
  <span
    class="stoqr-badge app-footer__mode"
    [class.stoqr-badge--low-stock]="config.isLive()"
    [class.stoqr-badge--unknown]="!config.isLive()"
  >
    <span class="stoqr-badge__dot"></span>{{ config.mode() }}
  </span>
  @for (sheet of config.sheets(); track sheet.key) {
    <span class="app-footer__sheet">{{ sheet.label }} ({{ sheet.tab }})</span>
  }
</footer>
